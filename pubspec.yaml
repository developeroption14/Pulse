name: pulse
description: Life Energy Tracker - Track your money, mood, and life
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  uuid: ^4.2.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21